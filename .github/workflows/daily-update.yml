name: Daily Walk & Lunch Update

on:
  schedule:
    # 10:50 UTC = 3:50 AM PDT (summer) / 2:50 AM PST (winter)
    # Offset from :00 to reduce GitHub Actions queue delays; delivers ~4 AM PDT
    - cron: "50 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily update
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python daily_update.py

      - name: Commit menu history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No menu data changes to commit."
          else
            git commit -m "data: record menu $(date -u +%F)"
            git push
          fi
